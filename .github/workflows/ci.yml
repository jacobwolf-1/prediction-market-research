name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Smoke test + pytest (pinned deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      # Public code-path reproducibility: synthetic fixtures only, no external
      # ESPN/Kalshi calls and no historical data downloads.
      - name: Public smoke test
        run: python pipeline/run_smoke_test.py

      - name: Unit + integration tests
        run: python -m pytest -q
